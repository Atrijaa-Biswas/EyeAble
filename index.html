<!DOCTYPE html>
<html>
<head>
  <title>EyeAble - Student</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #050d1a;
      --card:    #0f2040;
      --blue:    #1a6fff;
      --blue2:   #0d47d4;
      --cyan:    #1a6fff;
      --text:    #e8f0ff;
      --muted:   #6b84b0;
      --danger:  #1a4aaa;
      --success: #1a6fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 100vw; height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(26,111,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26,111,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none; z-index: 0;
    }

    /* ── top bar ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 52px;
      background: rgba(5,13,26,0.95);
      border-bottom: 1px solid rgba(26,111,255,0.25);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 1000;
    }
    .logo { font-family:'Orbitron',monospace; font-size:18px; font-weight:900; color:var(--cyan); letter-spacing:2px; text-shadow:0 0 20px rgba(26,111,255,0.6); }
    .logo span { color:var(--blue); }
    #userInfo { font-size:12px; color:var(--muted); }
    .logout-btn { background:transparent; color:var(--muted); border:1px solid var(--border); padding:5px 14px; border-radius:6px; font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:600; cursor:pointer; letter-spacing:1px; }
    .logout-btn:hover { background:rgba(255,59,92,0.15); }

    /* ── answer bar (fixed at top below topbar) ── */
    .answer-bar {
      position: fixed; top: 52px; left: 0; right: 0;
      background: rgba(5,13,26,0.92);
      border-bottom: 1px solid rgba(26,111,255,0.2);
      padding: 8px 20px; z-index: 900;
      display: flex; gap: 16px; align-items: center;
    }
    .q-label { font-family:'Orbitron',monospace; font-size:10px; letter-spacing:2px; color:var(--cyan); white-space:nowrap; }
    #questionText { font-size:15px; font-weight:600; color:var(--text); flex:1; }
    #output {
      width: 260px; padding: 6px 14px;
      font-family:'Orbitron',monospace; font-size:18px; font-weight:700;
      letter-spacing:4px; color:var(--cyan);
      background:var(--card); border:1px solid rgba(26,111,255,0.4);
      border-radius:8px; outline:none; resize:none; height:40px;
    }

    /* ── full-screen key canvas ── */
    #keyCanvas {
      position: fixed;
      top: 110px; left: 0; right: 0; bottom: 0;
      z-index: 1;
    }

    /* ── individual key ── */
    .key {
      position: absolute;
      width: 80px; height: 80px;
      font-family:'Orbitron',monospace; font-size:22px; font-weight:700;
      color: var(--text);
      background: var(--card);
      border: 1px solid rgba(26,111,255,0.3);
      border-radius: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
      user-select: none;
      overflow: hidden;
    }
    .key::after {
      content:''; position:absolute; bottom:0; left:0; height:4px;
      width: var(--dwell-progress,0%);
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      border-radius: 0 0 0 16px;
      box-shadow: 0 0 8px var(--cyan);
      transition: width 0.05s linear;
    }
    .key.active {
      border-color: var(--cyan);
      box-shadow: 0 0 28px rgba(26,111,255,0.5), 0 0 60px rgba(26,111,255,0.15);
      transform: scale(1.12);
      color: var(--cyan);
    }
    .key.space-key { width:160px; height:60px; font-size:13px; letter-spacing:3px; background:rgba(26,111,255,0.08); }
    .key.back-key  { width:120px; height:60px; font-size:13px; letter-spacing:2px; background:rgba(255,59,92,0.07); border-color:rgba(255,59,92,0.25); color:#ff8fa3; }

    /* submit floats bottom-center */
    #submitBtn {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 1000;
      padding: 14px 52px;
      font-family:'Orbitron',monospace; font-size:14px; font-weight:700; letter-spacing:2px;
      background: linear-gradient(135deg, var(--blue2), var(--blue));
      color: white; border: 1px solid var(--cyan); border-radius:10px;
      cursor:pointer; overflow:hidden;
      box-shadow: 0 0 24px rgba(26,111,255,0.3);
    }
    #submitBtn::after {
      content:''; position:absolute; bottom:0; left:0; height:4px;
      width:var(--dwell-progress,0%);
      background: linear-gradient(90deg, var(--cyan), white);
      box-shadow: 0 0 8px var(--cyan);
      transition: width 0.05s linear;
    }
    #submitBtn.gazing { box-shadow:0 0 40px rgba(26,111,255,0.6), 0 0 80px rgba(26,111,255,0.2); transform:translateX(-50%) scale(1.04); }
    .gaze-hint { display:block; font-size:9px; letter-spacing:1px; opacity:0.6; margin-top:3px; font-weight:400; }

    #clearBtn {
      position: fixed; bottom: 24px; right: 24px; z-index:1000;
      padding:10px 24px; font-family:'Orbitron',monospace; font-size:12px; letter-spacing:2px;
      background:transparent; color:var(--muted); border:1px solid rgba(107,132,176,0.3); border-radius:8px; cursor:pointer;
    }
    #clearBtn:hover { border-color:var(--muted); color:var(--text); }

    /* debug */
    #dbg {
      position:fixed; bottom:12px; left:12px; z-index:99998;
      background:rgba(0,0,0,0.92); color:#5599ff;
      font-family:'Courier New',monospace; font-size:11px;
      padding:8px 12px; border-radius:8px; border:1px solid rgba(0,255,170,0.2);
      line-height:1.8; pointer-events:none;
    }

    /* gaze pointer */
    #gazePointer {
      position:fixed; width:70px; height:70px; border-radius:50%;
      background:rgba(26,111,255,0.15); border:2px solid var(--cyan);
      box-shadow:0 0 0 6px rgba(26,111,255,0.07), 0 0 24px rgba(26,111,255,0.4);
      pointer-events:none; z-index:99999; transform:translate(-50%,-50%);
      transition: left 0.06s linear, top 0.06s linear;
    }
    #gazePointer::after {
      content:''; position:absolute; width:8px; height:8px; border-radius:50%;
      background:var(--cyan); top:50%; left:50%; transform:translate(-50%,-50%);
      box-shadow:0 0 6px var(--cyan);
    }

    #webgazerVideoContainer {
      position:fixed !important; top:54px !important; right:16px !important;
      left:auto !important; width:150px !important; height:110px !important;
      border:1px solid rgba(26,111,255,0.4) !important; border-radius:10px !important;
      overflow:hidden !important; background:#000 !important;
      box-shadow:0 0 16px rgba(26,111,255,0.15) !important; z-index:9999 !important;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo">EYE<span>ABLE</span></div>
    <div id="userInfo">Authenticating...</div>
    <button class="logout-btn" onclick="logout()">LOGOUT</button>
  </div>

  <div class="answer-bar">
    <div class="q-label">◈ Q</div>
    <div id="questionText">Loading...</div>
    <div class="q-label">◈ ANS</div>
    <textarea id="output" rows="1" placeholder="_ _ _"></textarea>
  </div>

  <div id="keyCanvas"></div>

  <div id="gazePointer"></div>
  <div id="dbg">Initialising...</div>

  <button id="submitBtn" onclick="submitAnswer()">
    SUBMIT
    <span class="gaze-hint">👁 STARE 0.5s</span>
  </button>
  <button id="clearBtn" onclick="clearAnswer()">CLEAR</button>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webgazer@2.1.0/dist/webgazer.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvOGMmLgbeZwpVpOAWeH5ilU077uOmz2s",
      authDomain: "eyeable-2026.firebaseapp.com",
      databaseURL: "https://eyeable-2026-default-rtdb.firebaseio.com",
      projectId: "eyeable-2026",
      storageBucket: "eyeable-2026.firebasestorage.app",
      messagingSenderId: "29944050006",
      appId: "1:29944050006:web:33515697c3aac35432e6f7"
    };
    firebase.initializeApp(firebaseConfig);
    const auth     = firebase.auth();
    const database = firebase.database();
    window.firebase  = firebase;
    window.database  = database;

    auth.onAuthStateChanged(user => {
      if (!user) { window.location.href = 'login.html'; return; }
      database.ref('users/' + user.uid).once('value').then(snap => {
        const data = snap.val();
        if (!data) {
          database.ref('users/' + user.uid).set({
            name: user.displayName || user.email,
            email: user.email, role: 'student',
            createdAt: new Date().toISOString()
          });
          document.getElementById('userInfo').innerText = user.email + ' · Student';
          return;
        }
        if (data.role === 'teacher') { window.location.href = 'teacher.html'; return; }
        if (data.role !== 'student') { auth.signOut(); window.location.href = 'login.html'; return; }
        document.getElementById('userInfo').innerText = (data.name || user.email) + ' · Student';
      }).catch(() => {
        document.getElementById('userInfo').innerText = user.email;
      });
    });

    function logout() {
      if (window.webgazer) try { webgazer.end(); } catch(e) {}
      auth.signOut().then(() => { localStorage.clear(); window.location.href = 'login.html'; });
    }

    // ── real-time question + grade listeners ─────────────
    // Called after auth is confirmed. Overrides script.js's one-time read
    // by hijacking window.loadQuestion before script.js executes it.
    function startRealtimeListeners(user) {
      // Replace script.js's loadQuestion with a real-time version
      // script.js calls loadQuestion() on window.load — by the time that
      // fires, this override is already in place.
      window.loadQuestion = function() {
        database.ref('currentQuestion').on('value', snap => {
          const q = snap.val();
          const el = document.getElementById('questionText');
          if (el) {
            el.innerText = q || 'Waiting for question...';
            if (q) localStorage.setItem('question', q);
          }
        });
      };

      // Listen for grades assigned to this student
      database.ref('grades/' + user.uid).on('value', snap => {
        const grades = snap.val();
        if (!grades) return;
        const arr = Object.values(grades).sort((a,b) => (b.gradedAt||0) - (a.gradedAt||0));
        if (arr.length) showGradeNotif(arr[0]);
      });
    }

    function showGradeNotif(g) {
      let el = document.getElementById('gradeNotif');
      if (!el) {
        el = document.createElement('div');
        el.id = 'gradeNotif';
        Object.assign(el.style, {
          position:'fixed', top:'115px', right:'20px', zIndex:'99990',
          background:'#0a1525', border:'1px solid rgba(26,111,255,0.5)',
          borderRadius:'14px', padding:'16px 24px', textAlign:'center',
          fontFamily:"'Orbitron',monospace",
          boxShadow:'0 0 30px rgba(26,111,255,0.25)', minWidth:'140px'
        });
        document.body.appendChild(el);
      }
      el.innerHTML =
        '<div style="font-size:10px;letter-spacing:2px;color:#4a6a9a;margin-bottom:6px">YOUR GRADE</div>' +
        '<div style="font-size:40px;font-weight:900;color:#1a6fff;text-shadow:0 0 20px rgba(26,111,255,0.5)">' + g.grade + '</div>' +
        '<div style="font-size:11px;color:#4a6a9a;margin-top:6px;max-width:120px;word-break:break-word">' + (g.question || '') + '</div>';
    }

    // Start listeners as soon as auth confirms the user
    auth.onAuthStateChanged(user => {
      if (user) startRealtimeListeners(user);
    });
  </script>

  <script src="script.js"></script>
</body>
</html>
