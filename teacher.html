<!DOCTYPE html>
<html>
<head>
  <title>EyeAble - Teacher Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #eef6fb; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar .brand { font-size: 20px; font-weight: bold; color: #333; }
    .top-bar .user-info { font-size: 14px; color: #555; }
    .logout-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }
    .logout-btn:hover { background: #c82333; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    h1 { text-align: center; margin-bottom: 30px; color: #333; }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      flex: 1;
      background: white;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .stat-card .num { font-size: 32px; font-weight: bold; color: #667eea; }
    .stat-card .label { font-size: 13px; color: #888; margin-top: 4px; }

    /* Section cards */
    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 24px;
    }
    .card h2 { margin-top: 0; margin-bottom: 16px; font-size: 18px; color: #444; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }

    /* Assignment form */
    .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .form-row input, .form-row textarea { flex: 1; }
    input[type="text"], textarea.question-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, textarea.question-input:focus { outline: none; border-color: #667eea; }
    textarea.question-input { resize: vertical; min-height: 80px; }
    .btn { padding: 10px 22px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .btn-primary { background: #667eea; color: white; }
    .btn-primary:hover { background: #5a67d8; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #c82333; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-sm { padding: 6px 14px; font-size: 13px; }

    /* Assignment list */
    .assignment-item {
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .assignment-item:hover { border-color: #667eea; box-shadow: 0 2px 8px rgba(102,126,234,0.12); }
    .assignment-item.selected { border-color: #667eea; background: #f7f8ff; }
    .assignment-item .info .title { font-weight: bold; font-size: 16px; color: #333; }
    .assignment-item .info .desc { font-size: 13px; color: #777; margin-top: 4px; }
    .assignment-item .info .meta { font-size: 12px; color: #bbb; margin-top: 6px; }
    .assignment-item .actions { display: flex; gap: 8px; flex-shrink: 0; margin-left: 12px; }
    .badge {
      display: inline-block;
      background: #28a745;
      color: white;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 8px;
    }

    /* Answers section */
    .answer-card {
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 12px;
      background: white;
    }
    .answer-card .student-name { font-weight: bold; color: #333; font-size: 15px; }
    .answer-card .answer-text {
      margin-top: 8px;
      font-size: 16px;
      color: #222;
      background: #f8f9fa;
      border-radius: 6px;
      padding: 10px 14px;
      word-break: break-word;
    }
    .answer-card .answer-meta { font-size: 12px; color: #aaa; margin-top: 6px; }
    .no-answers { color: #aaa; text-align: center; padding: 20px 0; font-size: 15px; }
    .tab-btns { display: flex; gap: 10px; margin-bottom: 18px; }
    .tab-btn { padding: 8px 20px; border: 2px solid #ddd; background: white; border-radius: 20px; font-size: 14px; cursor: pointer; font-weight: bold; color: #666; transition: all 0.2s; }
    .tab-btn.active { background: #667eea; color: white; border-color: #667eea; }
    .section { display: none; }
    .section.active { display: block; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">👁️ EyeAble</div>
    <div class="user-info" id="userInfo">Loading...</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <h1>👩‍🏫 Teacher Dashboard</h1>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="num" id="statAssignments">0</div>
        <div class="label">Assignments</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statAnswers">0</div>
        <div class="label">Total Submissions</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statStudents">0</div>
        <div class="label">Active Students</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-btns">
      <button class="tab-btn active" onclick="switchSection('assignments')">📋 Assignments</button>
      <button class="tab-btn" onclick="switchSection('answers')">📝 Submissions</button>
    </div>

    <!-- ASSIGNMENTS SECTION -->
    <div class="section active" id="section-assignments">
      <!-- Create Assignment -->
      <div class="card">
        <h2>➕ Create New Assignment</h2>
        <div class="form-row">
          <input type="text" id="assignmentTitle" placeholder="Assignment title (e.g. Spell: CAT)">
        </div>
        <div class="form-row">
          <textarea class="question-input" id="assignmentDesc" placeholder="Description / instructions for the student (e.g. Use eye tracking to type the word CAT on the keyboard)"></textarea>
        </div>
        <button class="btn btn-primary" onclick="createAssignment()">Save Assignment</button>
      </div>

      <!-- Assignment List -->
      <div class="card">
        <h2>📋 Your Assignments</h2>
        <div id="assignmentList"><p style="color:#aaa;text-align:center;padding:20px 0">No assignments yet. Create one above.</p></div>
      </div>
    </div>

    <!-- SUBMISSIONS SECTION -->
    <div class="section" id="section-answers">
      <div class="card">
        <h2>📝 Student Submissions</h2>
        <div style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <label style="font-weight:bold;font-size:14px;color:#555">Filter by Assignment:</label>
          <select id="filterAssignment" style="padding:8px 14px;border:2px solid #ddd;border-radius:8px;font-size:14px" onchange="loadAnswers()">
            <option value="all">All Assignments</option>
          </select>
          <button class="btn btn-secondary btn-sm" onclick="loadAnswers()">Refresh</button>
          <button class="btn btn-danger btn-sm" onclick="clearAllAnswers()">Clear All</button>
        </div>
        <div id="allAnswers"><p class="no-answers">Loading submissions...</p></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvOGMmLgbeZwpVpOAWeH5ilU077uOmz2s",
      authDomain: "eyeable-2026.firebaseapp.com",
      databaseURL: "https://eyeable-2026-default-rtdb.firebaseio.com",
      projectId: "eyeable-2026",
      storageBucket: "eyeable-2026.firebasestorage.app",
      messagingSenderId: "29944050006",
      appId: "1:29944050006:web:33515697c3aac35432e6f7",
      measurementId: "G-YMPV5EPEDV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }

      const snap = await db.ref('users/' + user.uid).once('value');
      const userData = snap.val();

      if (!userData || userData.role !== 'teacher') {
        if (userData && userData.role === 'student') window.location.href = 'index.html';
        else { auth.signOut(); window.location.href = 'login.html'; }
        return;
      }

      document.getElementById('userInfo').textContent = `${userData.name || user.email} (Teacher)`;
      loadAssignments();
      loadAnswers();
      setupRealtimeListeners();
    });

    function switchSection(name) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('section-' + name).classList.add('active');
      event.target.classList.add('active');
      if (name === 'answers') loadAnswers();
    }

    // ── ASSIGNMENTS ──────────────────────────────────────────────
    async function createAssignment() {
      const title = document.getElementById('assignmentTitle').value.trim();
      const desc = document.getElementById('assignmentDesc').value.trim();

      if (!title) { alert('Please enter an assignment title.'); return; }

      const assignment = {
        title,
        description: desc,
        createdAt: Date.now()
      };

      try {
        await db.ref('assignments').push(assignment);
        document.getElementById('assignmentTitle').value = '';
        document.getElementById('assignmentDesc').value = '';
        loadAssignments();
      } catch (e) {
        alert('Error saving assignment: ' + e.message);
      }
    }

    async function loadAssignments() {
      const snap = await db.ref('assignments').once('value');
      const data = snap.val();
      const list = document.getElementById('assignmentList');
      const filterSelect = document.getElementById('filterAssignment');

      // Reset filter options
      filterSelect.innerHTML = '<option value="all">All Assignments</option>';

      if (!data) {
        list.innerHTML = '<p style="color:#aaa;text-align:center;padding:20px 0">No assignments yet.</p>';
        document.getElementById('statAssignments').textContent = '0';
        return;
      }

      const items = Object.entries(data).sort((a, b) => b[1].createdAt - a[1].createdAt);
      document.getElementById('statAssignments').textContent = items.length;

      // Get answer counts per assignment
      const answersSnap = await db.ref('answers').once('value');
      const allAnswers = answersSnap.val() || {};
      const countMap = {};
      Object.values(allAnswers).forEach(a => {
        if (a.assignmentId) countMap[a.assignmentId] = (countMap[a.assignmentId] || 0) + 1;
      });

      let html = '';
      items.forEach(([id, a]) => {
        const count = countMap[id] || 0;
        const date = new Date(a.createdAt).toLocaleDateString();
        html += `
          <div class="assignment-item">
            <div class="info">
              <div class="title">${escHtml(a.title)} <span class="badge">${count} submission${count !== 1 ? 's' : ''}</span></div>
              ${a.description ? `<div class="desc">${escHtml(a.description)}</div>` : ''}
              <div class="meta">Created ${date}</div>
            </div>
            <div class="actions">
              <button class="btn btn-danger btn-sm" onclick="deleteAssignment('${id}', event)">Delete</button>
            </div>
          </div>`;

        filterSelect.innerHTML += `<option value="${id}">${escHtml(a.title)}</option>`;
      });

      list.innerHTML = html;
    }

    async function deleteAssignment(id, e) {
      e.stopPropagation();
      if (!confirm('Delete this assignment? Student submissions for it will remain.')) return;
      await db.ref('assignments/' + id).remove();
      loadAssignments();
    }

    // ── ANSWERS ───────────────────────────────────────────────────
    async function loadAnswers() {
      const filterVal = document.getElementById('filterAssignment').value;
      const snap = await db.ref('answers').once('value');
      const data = snap.val();
      const div = document.getElementById('allAnswers');

      if (!data) {
        div.innerHTML = '<p class="no-answers">No submissions yet.</p>';
        document.getElementById('statAnswers').textContent = '0';
        document.getElementById('statStudents').textContent = '0';
        return;
      }

      let items = Object.entries(data).map(([k, v]) => ({ id: k, ...v }));
      items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      // Update stats
      document.getElementById('statAnswers').textContent = items.length;
      const uniqueStudents = new Set(items.map(i => i.studentId).filter(Boolean));
      document.getElementById('statStudents').textContent = uniqueStudents.size;

      // Filter
      if (filterVal !== 'all') items = items.filter(i => i.assignmentId === filterVal);

      if (items.length === 0) {
        div.innerHTML = '<p class="no-answers">No submissions for this assignment yet.</p>';
        return;
      }

      // Get assignment titles for display
      const assignSnap = await db.ref('assignments').once('value');
      const assignments = assignSnap.val() || {};

      let html = '';
      items.forEach(item => {
        const date = item.timestamp ? new Date(item.timestamp).toLocaleString() : 'Unknown date';
        const studentName = item.studentName || item.studentEmail || 'Unknown student';
        const assignTitle = item.assignmentId && assignments[item.assignmentId]
          ? assignments[item.assignmentId].title
          : (item.question || 'General');

        html += `
          <div class="answer-card">
            <div class="student-name">👨‍🎓 ${escHtml(studentName)}</div>
            <div class="answer-meta">Assignment: <strong>${escHtml(assignTitle)}</strong></div>
            <div class="answer-text">${escHtml(item.text || '')}</div>
            <div class="answer-meta">Submitted: ${date}</div>
          </div>`;
      });

      div.innerHTML = html;
    }

    async function clearAllAnswers() {
      if (!confirm('Clear ALL submissions? This cannot be undone.')) return;
      await db.ref('answers').remove();
      loadAnswers();
    }

    function setupRealtimeListeners() {
      db.ref('answers').on('child_added', () => {
        loadAnswers();
        loadAssignments(); // refresh badge counts
      });
    }

    function logout() {
      auth.signOut().then(() => { window.location.href = 'login.html'; });
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
