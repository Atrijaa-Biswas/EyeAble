<!DOCTYPE html>
<html>
<head>
  <title>EyeAble - Teacher Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .wrap {
      position: relative; z-index: 1;
      max-width: 860px; margin: 80px auto 40px;
      padding: 0 24px;
    }

    .section-label {
      font-family: 'Orbitron', monospace;
      font-size: 11px; letter-spacing: 3px;
      color: var(--cyan); text-transform: uppercase;
      margin-bottom: 8px;
    }

    #questionInput {
      width: 100%; padding: 14px 18px;
      font-size: 17px; font-weight: 600;
      resize: vertical; min-height: 80px;
      margin-bottom: 14px;
    }

    .btn-row {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .answers-container { margin-top: 8px; }

    #allAnswers { display: flex; flex-direction: column; gap: 10px; }

    /* Answers section */
    .answer-card {
      display: flex; flex-direction: column; gap: 4px;
    }

    .no-answers {
      color: var(--muted); font-size: 14px;
      font-family: 'Orbitron', monospace; letter-spacing: 2px;
      padding: 20px 0; text-align: center;
    }

    /* live pulse dot */
    .live-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: var(--blue);
      box-shadow: 0 0 8px var(--blue);
      margin-right: 6px; animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; } 50% { opacity:0.3; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo">EYE<span>ABLE</span></div>
    <div class="user-info" id="userInfo">Loading...</div>
    <button class="logout-btn" onclick="logout()">LOGOUT</button>
  </div>

  <div class="wrap">
    <h1>◈ Teacher Dashboard</h1>

    <!-- Stats -->
    <div class="stats" id="stats">
      <strong>◈ Statistics</strong><br>
      Loading...
    </div>

    <!-- Question -->
    <div class="section-label">◈ Set Question</div>
    <textarea id="questionInput" placeholder="e.g. Type the word: CAT">Type the word: CAT</textarea>
    <div class="btn-row">
      <button onclick="saveQuestion()">Save Question</button>
      <button class="refresh-btn" onclick="loadAnswers()">↺ Refresh</button>
      <button class="clear-btn" onclick="clearAllAnswers()">✕ Clear All Answers</button>
    </div>

    <!-- Latest answer -->
    <div class="section-label">◈ Latest Answer</div>
    <div class="student-answer" id="currentStudentAnswer">No answer yet</div>

    <!-- All answers -->
    <div class="answers-container">
      <h2><span class="live-dot"></span>All Student Answers</h2>
      <div id="allAnswers"><p class="no-answers">Loading...</p></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvOGMmLgbeZwpVpOAWeH5ilU077uOmz2s",
      apiKey: "AIzaSyAvOGMmLgbeZwpVpOAWeH5ilU077uOmz2s",
      authDomain: "eyeable-2026.firebaseapp.com",
      databaseURL: "https://eyeable-2026-default-rtdb.firebaseio.com",
      projectId: "eyeable-2026",
      storageBucket: "eyeable-2026.firebasestorage.app",
      messagingSenderId: "29944050006",
      appId: "1:29944050006:web:33515697c3aac35432e6f7"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Wait for Firebase to restore session before acting on auth state.
    // On cold page load, onAuthStateChanged fires once with null before
    // the persisted session is resolved — we ignore that first null.
    let authResolved = false;
    auth.onAuthStateChanged(user => {
      if (!user) {
        // If we haven't resolved yet, this is the cold-start null — wait briefly
        if (!authResolved) {
          authResolved = true;
          // Give Firebase up to 3s to restore the session
          setTimeout(() => {
            if (!auth.currentUser) {
              window.location.href = 'login.html';
            }
          }, 3000);
          return;
        }
        // Genuine sign-out
        window.location.href = 'login.html';
        return;
      }
      authResolved = true;
      database.ref('users/' + user.uid).once('value').then(snap => {
        const data = snap.val();
        if (!data || data.role !== 'teacher') {
          auth.signOut();
          window.location.href = 'login.html';
          return;
        }
        document.getElementById('userInfo').innerText = (data.name || user.email) + ' · Teacher';
        loadExistingQuestion();
        loadAnswers();
        setupAnswersListener();
      });
    });

    function loadExistingQuestion() {
      database.ref('currentQuestion').once('value').then(s => {
        const q = s.val();
        if (q) document.getElementById('questionInput').value = q;
        else {
          const saved = localStorage.getItem('question');
          if (saved) document.getElementById('questionInput').value = saved;
        }
      });
    }

    function saveQuestion() {
      const q = document.getElementById('questionInput').value;
      database.ref('currentQuestion').set(q).then(() => {
        localStorage.setItem('question', q);
        alert('✅ Question saved: ' + q);
      }).catch(() => alert('Error saving question.'));
    }

    function loadAnswers() {
      database.ref('answers').orderByKey().limitToLast(1).once('value').then(snap => {
        const answers = snap.val();
        if (answers) {
          const latest = answers[Object.keys(answers).pop()];
          document.getElementById('currentStudentAnswer').innerText = latest.text || '—';
        } else {
          document.getElementById('currentStudentAnswer').innerText = localStorage.getItem('answer') || 'No answer yet';
        }
      });
      loadAllAnswers();
      updateStats();
    }

    function loadAllAnswers() {
      database.ref('answers').once('value').then(snap => {
        const answers = snap.val();
        const div = document.getElementById('allAnswers');
        if (!answers) { div.innerHTML = '<p class="no-answers">No answers yet</p>'; return; }
        const arr = Object.entries(answers)
          .map(([k,v]) => ({id:k,...v}))
          .sort((a,b) => (b.timestamp||0)-(a.timestamp||0));
        div.innerHTML = arr.map(a => {
          const date = a.timestamp ? new Date(a.timestamp).toLocaleString() : '—';
          const name = a.studentName || a.studentEmail || 'Unknown';
          return `<div class="answer-card">
            <strong>${name}</strong>
            <p>${a.text || ''}</p>
            <small>Submitted: ${date}</small>
          </div>`;
        }).join('');
      }).catch(() => {
        document.getElementById('allAnswers').innerHTML = '<p class="no-answers">Error loading answers</p>';
      });
    }

    function updateStats() {
      database.ref('answers').once('value').then(snap => {
        const answers = snap.val();
        const total = answers ? Object.keys(answers).length : 0;
        const unique = new Set(answers ? Object.values(answers).map(a=>a.studentId).filter(Boolean) : []).size;
        document.getElementById('stats').innerHTML =
          `<strong>◈ Statistics</strong><br>
           Total Answers: ${total} &nbsp;·&nbsp; Active Students: ${unique}`;
      });
    }

    function setupAnswersListener() {
      database.ref('answers').on('child_added', () => {
        loadAllAnswers(); updateStats(); loadAnswers();
      });
    }

    function clearAllAnswers() {
      if (!confirm('Clear all answers? This cannot be undone.')) return;
      database.ref('answers').remove().then(() => {
        localStorage.removeItem('answer');
        document.getElementById('currentStudentAnswer').innerText = 'No answer yet';
        document.getElementById('allAnswers').innerHTML = '<p class="no-answers">No answers yet</p>';
        updateStats();
        alert('✅ All answers cleared');
      }).catch(() => alert('Error clearing answers.'));
    }

    function logout() {
      auth.signOut().then(() => { localStorage.clear(); window.location.href = 'login.html'; });
    }

    setInterval(loadAnswers, 5000);
  </script>
</body>
</html>
