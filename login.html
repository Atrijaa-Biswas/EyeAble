<!DOCTYPE html>
<html>
<head>
  <title>EyeAble - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; overflow: auto; padding: 24px;
    }

    .auth-container {
      position: relative; z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px 36px;
      width: 420px; max-width: 100%;
      text-align: center;
      box-shadow: 0 0 60px rgba(26,111,255,0.1);
    }

    .auth-logo {
      font-family: 'Orbitron', monospace;
      font-size: 32px; font-weight: 900;
      color: var(--cyan); letter-spacing: 4px;
      text-shadow: 0 0 28px rgba(26,111,255,0.2);
      margin-bottom: 6px;
    }
    .auth-logo span { color: var(--blue); }
    .auth-sub {
      font-size: 13px; color: var(--muted);
      letter-spacing: 1px; margin-bottom: 30px;
    }

    /* tabs */
    .tab-container {
      display: flex; border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .tab {
      flex: 1; padding: 12px; font-family: 'Orbitron', monospace;
      font-size: 12px; letter-spacing: 2px;
      background: none; border: none; color: var(--muted);
      cursor: pointer; transition: color 0.2s;
      box-shadow: none; border-radius: 0;
      text-transform: uppercase;
    }
    .tab:hover { transform: none; box-shadow: none; color: var(--text); }
    .tab.active { color: var(--cyan); border-bottom: 2px solid var(--cyan); }

    /* auth forms */
    .auth-form { display: none; }
    .auth-form.active { display: block; }

    /* role selector */
    .role-selector { display: flex; gap: 10px; margin-bottom: 22px; }
    .role-btn {
      flex: 1; padding: 10px;
      font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: 1px;
      background: var(--surface); color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; transition: all 0.2s;
      box-shadow: none;
    }
    .role-btn:hover { color: var(--text); border-color: var(--blue); transform: none; box-shadow: none; }
    .role-btn.active {
      background: rgba(26,111,255,0.15);
      border-color: var(--cyan); color: var(--cyan);
      box-shadow: 0 0 12px rgba(26,111,255,0.2);
    }

    /* input groups */
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label {
      display: block; margin-bottom: 5px;
      font-family: 'Orbitron', monospace; font-size: 10px;
      letter-spacing: 2px; color: var(--muted); text-transform: uppercase;
    }
    .input-group input {
      width: 100%; padding: 12px 16px;
      font-size: 15px; font-weight: 600;
    }

    /* auth action button */
    .auth-btn {
      width: 100%; padding: 14px;
      font-family: 'Orbitron', monospace; font-size: 13px;
      letter-spacing: 2px; margin-bottom: 16px;
      background: linear-gradient(135deg, var(--blue2), var(--blue));
      border: 1px solid var(--cyan);
      box-shadow: 0 0 20px rgba(26,111,255,0.3);
    }
    .auth-btn:hover { box-shadow: 0 0 32px rgba(26,111,255,0.5); }

    /* google button */
    .google-btn {
      width: 100%; padding: 12px;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: none;
    }
    .google-btn:hover { border-color: var(--blue); box-shadow: 0 0 14px rgba(26,111,255,0.2); transform: none; }
    .google-btn img { width: 20px; height: 20px; }

    /* divider */
    .divider {
      display: flex; align-items: center;
      color: var(--muted); margin: 18px 0; font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; border-bottom: 1px solid var(--border);
    }
    .divider span { padding: 0 12px; letter-spacing: 1px; }

    /* messages */
    .error-message {
      color: var(--muted); background: rgba(26,111,255,0.15);
      border: 1px solid rgba(26,111,255,0.15);
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; margin: 12px 0; display: none;
    }
    .success-message {
      color: var(--blue); background: rgba(26,111,255,0.1);
      border: 1px solid rgba(26,111,255,0.1);
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; margin: 12px 0; display: none;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-logo">EYE<span>ABLE</span></div>
    <div class="auth-sub">Eye-Gaze Assisted Learning</div>

    <div class="tab-container">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Login -->
    <div id="loginForm" class="auth-form active">
      <div class="role-selector">
        <button class="role-btn teacher" onclick="setRole('teacher','login')">👩‍🏫 Teacher</button>
        <button class="role-btn student active" onclick="setRole('student','login')">👨‍🎓 Student</button>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <button class="auth-btn" onclick="loginWithEmail()">Login</button>
      <div class="divider"><span>OR</span></div>
      <button class="google-btn" onclick="loginWithGoogle()">
        <img src="https://www.google.com/favicon.ico" alt="G"> Continue with Google
      </button>
      <div class="error-message" id="loginError"></div>
    </div>

    <!-- Sign Up -->
    <div id="signupForm" class="auth-form">
      <p class="role-note">Select your role:</p>
      <div class="role-selector">
        <button class="role-btn teacher" onclick="setRole('teacher','signup')">👩‍🏫 Teacher</button>
        <button class="role-btn student active" onclick="setRole('student','signup')">👨‍🎓 Student</button>
      </div>
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Your name">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Min. 6 characters">
      </div>
      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" id="signupConfirmPassword" placeholder="Repeat password">
      </div>
      <button class="auth-btn" onclick="signupWithEmail()">Create Account</button>
      <div class="divider"><span>OR</span></div>
      <button class="google-btn" onclick="loginWithGoogle()">
        <img src="https://www.google.com/favicon.ico" alt="G"> Sign up with Google
      </button>
      <div class="success-message" id="signupSuccess"></div>
      <div class="error-message" id="signupError"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvOGMmLgbeZwpVpOAWeH5ilU077uOmz2s",
      authDomain: "eyeable-2026.firebaseapp.com",
      databaseURL: "https://eyeable-2026-default-rtdb.firebaseio.com",
      projectId: "eyeable-2026",
      storageBucket: "eyeable-2026.firebasestorage.app",
      messagingSenderId: "29944050006",
      appId: "1:29944050006:web:33515697c3aac35432e6f7"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    let selectedRole = 'student';
    let currentForm  = 'login';

    function switchTab(tab) {
      currentForm = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const tabBtn = document.querySelector('.' + tab + '-tab');
      if (tabBtn) tabBtn.classList.add('active');
      else {
        const all = document.querySelectorAll('.tab');
        if (tab === 'login') all[0] && all[0].classList.add('active');
        if (tab === 'signup') all[1] && all[1].classList.add('active');
      }
      document.getElementById('loginForm').classList.toggle('active',  tab==='login');
      document.getElementById('signupForm').classList.toggle('active', tab==='signup');
      // Preserve the currently selected role when switching tabs
      setRole(selectedRole || 'student', tab);
    }

    function setRole(role, form) {
      selectedRole = role;
      const sel = form==='login' ? '#loginForm' : '#signupForm';
      document.querySelectorAll(sel + ' .role-btn').forEach(b => b.classList.remove('active'));
      const roleBtn = document.querySelector(sel + ' .role-btn.' + role);
      if (roleBtn) roleBtn.classList.add('active');
    }

    async function signupWithEmail() {
      const name  = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const pass  = document.getElementById('signupPassword').value;
      const conf  = document.getElementById('signupConfirmPassword').value;
      hide('signupError'); hide('signupSuccess');
      if (!name||!email||!pass||!conf) return showErr('signupError','Please fill in all fields');
      if (pass.length < 6)             return showErr('signupError','Password must be at least 6 characters');
      if (pass !== conf)               return showErr('signupError','Passwords do not match');
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await cred.user.updateProfile({ displayName: name });
        await database.ref('users/' + cred.user.uid).set({ name, email, role: selectedRole, createdAt: new Date().toISOString() });
        showOk('signupSuccess','Account created! Redirecting...');
        setTimeout(() => redirect(selectedRole), 1500);
      } catch(e) { showErr('signupError', friendlyError(e)); }
    }

    async function loginWithEmail() {
      const email = document.getElementById('loginEmail').value;
      const pass  = document.getElementById('loginPassword').value;
      hide('loginError');
      if (!email||!pass) return showErr('loginError','Please enter email and password');
      try {
        const cred = await auth.signInWithEmailAndPassword(email, pass);
        // Always read role from DB — never trust selectedRole UI state for existing users
        const snap = await database.ref('users/' + cred.user.uid).once('value');
        const data = snap.val();
        if (data && data.role) {
          // Role mismatch: user selected Teacher but their account is Student (or vice versa)
          if (data.role !== selectedRole) {
            await auth.signOut();
            showErr('loginError', `This account is registered as a ${data.role}. Please select the correct role above.`);
            return;
          }
          redirect(data.role);
        } else {
          // New user with no record yet — create one with the role they selected in UI
          await database.ref('users/' + cred.user.uid).set({
            name: cred.user.displayName || email,
            email: email,
            role: selectedRole,
            createdAt: new Date().toISOString()
          });
          redirect(selectedRole);
        }
      } catch(e) { showErr('loginError', friendlyError(e)); }
    }

    async function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt:'select_account', authuser:'-1' });
      try {
        const result = await auth.signInWithPopup(provider);
        const snap   = await database.ref('users/' + result.user.uid).once('value');
        if (!snap.exists()) {
          await database.ref('users/' + result.user.uid).set({
            name: result.user.displayName, email: result.user.email,
            role: selectedRole, createdAt: new Date().toISOString()
          });
          redirect(selectedRole);
        } else { redirect(snap.val().role); }
      } catch(e) {
        showErr(currentForm==='login' ? 'loginError' : 'signupError', 'Google sign-in failed: ' + e.message);
      }
    }

    function redirect(role) {
      if (role === 'teacher') {
        localStorage.setItem('isLoggedIn','true');
        localStorage.setItem('role', role);
        window.location.href = 'teacher.html';
      } else if (role === 'student') {
        localStorage.setItem('isLoggedIn','true');
        localStorage.setItem('role', role);
        window.location.href = 'index.html';
      } else {
        // Unknown role — show error instead of redirecting anywhere
        const errId = currentForm === 'login' ? 'loginError' : 'signupError';
        showErr(errId, 'Account has no role assigned. Please contact your administrator.');
      }
    }

    function friendlyError(e) {
      const map = {
        'auth/email-already-in-use': 'Email is already registered.',
        'auth/invalid-email':        'Invalid email address.',
        'auth/weak-password':        'Password is too weak.',
        'auth/user-not-found':       'User not found.',
        'auth/wrong-password':       'Incorrect password.',
        'auth/user-disabled':        'This account has been disabled.',
      };
      return map[e.code] || e.message;
    }

    function showErr(id, msg) { const el=document.getElementById(id); el.textContent=msg; el.style.display='block'; }
    function showOk(id, msg)  { const el=document.getElementById(id); el.textContent=msg; el.style.display='block'; }
    function hide(id)         { document.getElementById(id).style.display='none'; }

    setRole('student','login');

    // If running from file://, Firebase auth (Google popup / some network requests)
    // may fail in some browsers. Show a helpful note to the user.
    if (window.location && window.location.protocol === 'file:') {
      const sub = document.querySelector('.auth-sub');
      if (sub) sub.innerText = sub.innerText + ' — Note: run a local server (http://localhost) for full auth functionality.';
    }
  </script>
</body>
</html>
