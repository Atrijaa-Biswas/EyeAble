<!DOCTYPE html>
<html>
<head>
  <title>EyeAble - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    .auth-container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 420px;
      max-width: 100%;
      text-align: center;
    }
    .auth-container h1 { color: #333; font-size: 32px; margin-bottom: 6px; }
    .auth-container .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    .tab-container {
      display: flex;
      margin-bottom: 28px;
      border-bottom: 2px solid #eee;
    }
    .tab {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      transition: color 0.2s;
    }
    .tab.active { color: #667eea; border-bottom: 3px solid #667eea; margin-bottom: -2px; }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .input-group { margin-bottom: 18px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    .input-group input:focus { outline: none; border-color: #667eea; }
    .role-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }
    .role-note { font-size: 13px; color: #888; margin-bottom: 18px; text-align: left; }
    .role-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      background: white;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      color: #555;
    }
    .role-btn.teacher.active { background: #28a745; color: white; border-color: #28a745; }
    .role-btn.student.active { background: #007bff; color: white; border-color: #007bff; }
    .auth-btn {
      width: 100%;
      padding: 13px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 14px;
      transition: background 0.2s;
    }
    .auth-btn:hover { background: #5a67d8; }
    .google-btn {
      width: 100%;
      padding: 13px;
      background: white;
      color: #444;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      transition: all 0.2s;
    }
    .google-btn:hover { background: #f8f9fa; border-color: #4285f4; }
    .google-btn img { width: 22px; height: 22px; }
    .divider {
      display: flex;
      align-items: center;
      color: #bbb;
      margin: 16px 0;
      font-size: 13px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #eee; }
    .divider span { padding: 0 10px; }
    .error-msg {
      color: #dc3545;
      background: #f8d7da;
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
      margin-bottom: 12px;
      display: none;
    }
    .success-msg {
      color: #155724;
      background: #d4edda;
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
      margin-bottom: 12px;
      display: none;
    }
    .switch-link { color: #888; font-size: 14px; margin-top: 10px; }
    .switch-link a { color: #667eea; text-decoration: none; font-weight: bold; cursor: pointer; }
    .switch-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-container">
    <h1>👁️ EyeAble</h1>
    <p class="subtitle">Eye-tracking powered learning</p>

    <div class="tab-container">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm" class="auth-form active">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="Enter your email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password">
      </div>
      <div class="error-msg" id="loginError"></div>
      <button class="auth-btn" onclick="loginWithEmail()">Login</button>
      <div class="divider"><span>OR</span></div>
      <p class="role-note">Signing in with Google? Choose your role first:</p>
      <div class="role-selector">
        <button class="role-btn teacher" id="loginTeacherBtn" onclick="setLoginRole('teacher')">👩‍🏫 Teacher</button>
        <button class="role-btn student active" id="loginStudentBtn" onclick="setLoginRole('student')">👨‍🎓 Student</button>
      </div>
      <button class="google-btn" onclick="loginWithGoogle()">
        <img src="https://www.google.com/favicon.ico" alt="Google">
        Continue with Google
      </button>
      <div class="switch-link">Don't have an account? <a onclick="switchTab('signup')">Sign up</a></div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" class="auth-form">
      <p class="role-note">Select your role:</p>
      <div class="role-selector">
        <button class="role-btn teacher" id="signupTeacherBtn" onclick="setSignupRole('teacher')">👩‍🏫 Teacher</button>
        <button class="role-btn student active" id="signupStudentBtn" onclick="setSignupRole('student')">👨‍🎓 Student</button>
      </div>
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Enter your name">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="Enter your email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="At least 6 characters">
      </div>
      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" id="signupConfirmPassword" placeholder="Repeat password">
      </div>
      <div class="error-msg" id="signupError"></div>
      <div class="success-msg" id="signupSuccess"></div>
      <button class="auth-btn" onclick="signupWithEmail()">Create Account</button>
      <div class="divider"><span>OR</span></div>
      <button class="google-btn" onclick="loginWithGoogle()">
        <img src="https://www.google.com/favicon.ico" alt="Google">
        Sign up with Google
      </button>
      <div class="switch-link">Already have an account? <a onclick="switchTab('login')">Login</a></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvOGMmLgbeZwpVpOAWeH5ilU077uOmz2s",
      authDomain: "eyeable-2026.firebaseapp.com",
      databaseURL: "https://eyeable-2026-default-rtdb.firebaseio.com",
      projectId: "eyeable-2026",
      storageBucket: "eyeable-2026.firebasestorage.app",
      messagingSenderId: "29944050006",
      appId: "1:29944050006:web:33515697c3aac35432e6f7",
      measurementId: "G-YMPV5EPEDV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    let loginRole = 'student';   // used only for Google sign-in on login tab
    let signupRole = 'student';  // used for all signup paths

    auth.signOut(); // always force fresh login

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      if (tab === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('signupForm').classList.add('active');
      }
    }

    function setLoginRole(role) {
      loginRole = role;
      document.getElementById('loginTeacherBtn').classList.toggle('active', role === 'teacher');
      document.getElementById('loginStudentBtn').classList.toggle('active', role === 'student');
    }

    function setSignupRole(role) {
      signupRole = role;
      document.getElementById('signupTeacherBtn').classList.toggle('active', role === 'teacher');
      document.getElementById('signupStudentBtn').classList.toggle('active', role === 'student');
    }

    async function loginWithEmail() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      hideMsg('loginError');

      if (!email || !password) { showError('loginError', 'Please enter email and password.'); return; }

      try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const snap = await database.ref('users/' + result.user.uid).once('value');
        const userData = snap.val();
        redirectToDashboard(userData ? userData.role : 'student');
      } catch (err) {
        showError('loginError', friendlyAuthError(err));
      }
    }

    async function signupWithEmail() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirmPassword').value;
      hideMsg('signupError'); hideMsg('signupSuccess');

      if (!name || !email || !password || !confirm) { showError('signupError', 'Please fill in all fields.'); return; }
      if (password.length < 6) { showError('signupError', 'Password must be at least 6 characters.'); return; }
      if (password !== confirm) { showError('signupError', 'Passwords do not match.'); return; }

      try {
        const result = await auth.createUserWithEmailAndPassword(email, password);
        await result.user.updateProfile({ displayName: name });
        await database.ref('users/' + result.user.uid).set({
          name, email, role: signupRole, createdAt: new Date().toISOString()
        });
        showSuccess('signupSuccess', 'Account created! Redirecting...');
        setTimeout(() => redirectToDashboard(signupRole), 1200);
      } catch (err) {
        showError('signupError', friendlyAuthError(err));
      }
    }

    async function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      // Determine which role to use based on active tab
      const isSignupTab = document.getElementById('signupForm').classList.contains('active');
      const roleToUse = isSignupTab ? signupRole : loginRole;

      try {
        const result = await auth.signInWithPopup(provider);
        const snap = await database.ref('users/' + result.user.uid).once('value');
        if (!snap.exists()) {
          await database.ref('users/' + result.user.uid).set({
            name: result.user.displayName,
            email: result.user.email,
            role: roleToUse,
            createdAt: new Date().toISOString()
          });
          redirectToDashboard(roleToUse);
        } else {
          redirectToDashboard(snap.val().role);
        }
      } catch (err) {
        showError('loginError', 'Google sign-in failed: ' + err.message);
      }
    }

    function redirectToDashboard(role) {
      if (role === 'teacher') window.location.href = 'teacher.html';
      else window.location.href = 'index.html';
    }

    function friendlyAuthError(err) {
      const map = {
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/invalid-email': 'Invalid email address.',
        'auth/email-already-in-use': 'This email is already registered.',
        'auth/weak-password': 'Password is too weak.',
        'auth/user-disabled': 'This account has been disabled.',
        'auth/invalid-credential': 'Email or password is incorrect.',
      };
      return map[err.code] || err.message;
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg; el.style.display = 'block';
    }
    function showSuccess(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg; el.style.display = 'block';
    }
    function hideMsg(id) { document.getElementById(id).style.display = 'none'; }
  </script>
</body>
</html>
